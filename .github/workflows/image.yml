name: Image

# The container image on every PR: image.yml in those-who-run/.github builds it from
# the Dockerfile, smoke-tests it and pushes nothing. The job is required by name on
# `main` as `image / build`; renaming the job leaves `main` waiting for a check that
# never reports. A repository without an image deletes this file with the
# Dockerfile, .dockerignore and release.yml (README.md, "Without an image").
#
# It runs in the merge queue too (merge_group), as ci.yml does, and still pushes
# nothing there: this job may only read, and publishing is release.yml's.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Nothing by default; the job asks for what it uses.
permissions: {}

# As in ci.yml: only a superseded PR run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The smoke test runs the image as it would be deployed: it must start as its
  # non-root user, open its store in /data and answer GET /healthz within 10 s.
  # There is no NATS server here, so the answer is 503 with "connected": false
  # (README.md, "Running").
  image:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/image.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      smoke: |
        docker run --rm "$IMAGE" -version
        user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE")
        if [ "$user" != 65532:65532 ]; then
          echo "the image runs as '$user', not distroless's nonroot user" >&2
          exit 1
        fi
        id=$(docker run --detach --publish 127.0.0.1:8080:8080 "$IMAGE")
        trap 'docker logs "$id"; docker rm --force "$id" >/dev/null' EXIT
        for _ in $(seq 20); do
          body=$(curl --silent --show-error --write-out ' %{http_code}' http://127.0.0.1:8080/healthz) || body=
          case $body in
            *'"connected":false'*' 503')
              if docker logs "$id" | grep -q '"msg":"store open"'; then echo "$body"; exit 0; fi ;;
          esac
          sleep 0.5
        done
        echo "GET /healthz did not answer within 10 s" >&2
        exit 1
