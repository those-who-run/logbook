name: Scorecard

# OpenSSF Scorecard: an outside, weekly check that the repository's settings and
# workflows stay as the guardrails set them (token permissions, pinned
# dependencies, dangerous workflows and more). It runs with the Actions token, which
# can't read branch rules, so its Branch-Protection check is inconclusive. The
# result is published to scorecard.dev and uploaded to code scanning. It gates
# nothing: the score is for drift.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  push:
    branches: [main]
  workflow_dispatch: # a score on demand

# Least privilege: nothing by default; the job asks for what the action uses.
permissions: {}

# Actions are pinned by commit SHA (the tag in the comment); Renovate bumps them.
# scorecard-action verifies the workflow it runs in before publishing: no run:
# steps, no workflow-level write permission, and only checkout, upload-artifact,
# codeql-action/upload-sarif, scorecard-action and harden-runner.
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the SARIF upload to code scanning
      id-token: write # publish_results: the OIDC token that signs the result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
