# The checks a commit meets before it is made: `make hooks` (`pre-commit install`)
# sets them up, CI's `checks / checks` job (checks.yml in those-who-run/.github) runs
# them on every file, and .claude/hooks/guard.py stops an agent from skipping them.
# They are paddock's language-neutral hooks, with the same pins, plus the link check
# and the Go hooks. `make check` runs them with the rest of CI.
#
# The external hooks are pinned to a commit SHA, the tag in the `frozen:` comment;
# Renovate bumps them: renovate.json extends those-who-run/.github's shared preset
# at a release tag, which turns on Renovate's pre-commit manager (off by default)
# and keeps the comment in step with the SHA. tests/test_precommit_config.py, which `make test`
# and CI's `test` job run, fails a hand edit to `rev: vX.Y.Z`.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  # The link check, standard-library Python with no network. It reads every Markdown
  # file whichever file changed: renaming a heading breaks links elsewhere.
  - repo: local
    hooks:
      - id: docs-links
        name: internal Markdown links resolve (scripts/docs_links.py)
        entry: python3 scripts/docs_links.py
        language: system
        # Only on Markdown changes, to keep commits quick: a commit that deletes or
        # renames another file a page links to is caught by `make check` and CI's
        # `test` job, which run the check on every page.
        files: \.md$
        pass_filenames: false

  # Go: gofmt, `go mod tidy` and golangci-lint, through the Makefile's targets, so a
  # commit and `make check` run the same commands, the ones go.yml runs in CI's
  # `go / check`. golangci-lint is the version tools/go.mod pins (`go tool
  # -modfile=tools/go.mod`), and gofmt comes with Go. A missing tool fails its hook
  # rather than passing on an empty result: `make`, `go` or `gofmt` not found, or a
  # golangci-lint that `go tool` can't fetch or build. Each checks the whole module
  # whichever Go file changed, since a change in one file can break another.
  # checks.yml installs Go from go.mod for them (ci.yml's `go-version-file`).
  - repo: local
    hooks:
      - id: gofmt
        name: Go code is formatted (make fmt-check)
        entry: make fmt-check
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-mod-tidy
        name: go.mod and tools/go.mod are tidy (make tidy)
        entry: make tidy
        language: system
        files: (\.go|(^|/)go\.(mod|sum))$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint, the version tools/go.mod pins (make lint)
        entry: make lint
        language: system
        files: (\.go|(^|/)go\.(mod|sum)|^\.golangci\.yml)$
        pass_filenames: false

  # gitleaks: the staged changes, before they are committed. In `--all-files` runs
  # (CI) there is nothing staged, so it scans nothing there; checks.yml scans every
  # commit in a PR with its own gitleaks-pr hook.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # The workflows: actionlint for syntax and expressions, zizmor for the security
  # audits that need no network, among them that every action is pinned by SHA.
  # actionlint's shellcheck and pyflakes are off, so a run gives the same answer on a
  # laptop without them as in CI.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --min-severity=medium]

  # The commit message: a conventional commit with one of the types checks.yml allows
  # in a PR title (its commit-types input), so a commit and its squash agree.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [feat, fix, perf, revert, deps, docs, refactor, test, build, ci, chore, style]
